[project]
name = "ai-database-architect-backend"
version = "0.1.0"
description = "AI Database Architect Backend - Intelligent database schema understanding & ER modeling platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "pymysql>=1.1.0",
  "psycopg2-binary>=2.9.0",
  "cryptography>=41.0.0",
  "httpx>=0.25.0",
  "python-dotenv>=1.0.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "typing-extensions>=4.8.0",
  "sqlglot>=25.0.0",
  "networkx>=3.0.0",
  "mcp>=1.15.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "reportlab>=4.0.0",
]

[tool.uv]
package = false
managed = true

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
